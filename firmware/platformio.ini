; Smart Speed Detection — IR gate firmware (Arduino Uno)
; Docs + protocol contract: README.md (mirrors packages/shared/src/serial.ts)

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_flags =
    -Wall
    -Wextra
